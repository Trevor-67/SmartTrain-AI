<div class="timeline">

    {% if timeline %}

        {% for event in timeline %}

            <div class="timeline-item">

                <div class="timeline-dot">
                    ✓
                </div>


                <div class="timeline-content">

                    <strong>
                        {{ event.event_type }}
                    </strong>


                    <p>
                        {{ event.message }}
                    </p>


                    <small>
                        {{ event.created_at }}
                    </small>

                </div>

            </div>

        {% endfor %}

    {% else %}

        <div class="empty-timeline">

            No activity has been recorded yet.

        </div>

    {% endif %}

</div>
